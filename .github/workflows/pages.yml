name: pages

# Publica el tablero (app/src/main/assets) como sitio web en GitHub Pages,
# para abrirlo en el navegador de la tablet sin instalar el APK. El mismo
# HTML/CSS/JS: reloj en vivo, temas automáticos, calendario, versículo, notas
# y compras (los datos viven en IndexedDB del navegador). Spotify/Telegram/
# hardware quedan inactivos aquí porque requieren el puente nativo.

on:
  push:
    branches: [ "claude/xiaomi-pad5-dashboard-d08ikt" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaquetar assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
